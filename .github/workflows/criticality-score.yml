name: OpenSSF Criticality Score

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  criticality:
    name: Calculate Criticality Score
    runs-on: ubuntu-latest

    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install OpenSSF Criticality Score
        run: |
          go install github.com/ossf/criticality_score/v2/cmd/criticality_score@v2.0.4

      - name: Calculate Criticality Score
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$(go env GOPATH)/bin/criticality_score" \
            -depsdev-disable \
            -format json \
            https://github.com/DTDucas/chm-converter
